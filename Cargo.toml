[package]
name = "mg-brief"
version = "0.1.0"
edition = "2021"
description = "Local-first RSS/Atom artifact collector"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
feed-rs = "2"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = { level = "deny", priority = -1 }
print_stdout = "allow"
print_stderr = "allow"
